# smp 스킬의 레포 기본 설정이다. 스킬 인자가 있으면 인자가 이긴다. 이 파일에서 지운 키는 같은 값의 플러그인 기본값을 쓴다.
# 모델 값은 session(현재 세션이 직접 수행) 또는 opencodex 에서 켠 모델 이름이다. 이름은 `/smp:map model` 로 볼 수 있다.

# worktree.sh finish 의 검증 명령과 push 명령(메인 워크트리의 프로젝트 루트에서 실행). 큰따옴표는 값 안에 쓰지 않는다. 필요하면 풀고 쓴다.
# 검증 명령이 없으면 scripts/verify.sh 가 있을 때 bash scripts/verify.sh 를 쓰고, push 키가 없으면 push 하지 않는다.
verify="pnpm run verify"
# push="git push"

# 중심 브랜치. 변경 워크트리가 여기서 시작하고 여기로 병합된다. 없으면 main, master, 메인 워크트리의 브랜치 순으로 고른다.
# central="develop"

# /smp:plan 의 구현 작업자 모델. /smp:plan model <값> 으로도 바꾼다.
impl_model="anthropic/claude-opus-5-5"
# /smp:map 의 지도 작성 작업자 모델. /smp:map model <값> 으로도 바꾼다.
map_model="gpt-6.1-terra"
# /smp:critic 의 대조 작업자 모델. /smp:critic model <값> 으로도 바꾼다.
critic_model="anthropic/claude-opus-5-5"
# /smp:atlassian 의 쓰기(Jira 이슈·Confluence 페이지) 초안 작성과 등록을 맡는 작업자 모델. /smp:atlassian model <값> 으로도 바꾼다.
atlassian_model="gpt-6.1-terra"
# /smp:gpt-image 가 image_gen 을 부르는 codex 에이전트 모델(codex exec -m). 이미지 모델(flare·sunburst)과 무관하다.
gpt_image_codex_model="gpt-6.1-terra"
# /smp:gpt-image 의 codex 추론 강도. none | minimal | low | medium | high | xhigh | max | ultra (모델마다 지원 범위가 다르다)
gpt_image_effort="xhigh"
# /smp:gpt-image 의 이미지 품질. low | medium | high | auto
gpt_image_quality="high"
