name: u3-whisper-windows
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: u3-whisper-windows
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test whisper-cli
        run: ./u3/scripts/build-whisper-windows.ps1
      - name: Write SHA-256 and dumpbin output to the job summary
        if: always()
        run: |
          '## whisper-cli v1.9.5 / Windows x64' >> $env:GITHUB_STEP_SUMMARY
          'Expected: Windows system DLLs only; no MSVCP*, VCRUNTIME*, VCOMP*, ucrtbase.dll or api-ms-win-crt-* imports (/MT).' >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in @('out/whisper-cli-win32-x64.exe.sha256', 'out/whisper-cli-win32-x64.dumpbin.txt')) {
            if (Test-Path -LiteralPath $file) {
              "### $file" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content -LiteralPath $file >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-win32-x64
          path: out/whisper-cli-win32-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload to the existing private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh release view whisper-cli-1.9.5 --json isPrerelease
          if ($LASTEXITCODE -ne 0) { throw '기존 whisper-cli-1.9.5 prerelease를 찾지 못했습니다.' }
          $release = ($releaseJson -join "`n") | ConvertFrom-Json
          if (-not $release.isPrerelease) { throw 'whisper-cli-1.9.5가 prerelease가 아닙니다.' }
          # No --clobber: an existing asset must fail without changing its bytes.
          gh release upload whisper-cli-1.9.5 out/whisper-cli-win32-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'asset 업로드에 실패했습니다. 기존 asset은 덮어쓰지 않습니다.' }
