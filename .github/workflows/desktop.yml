name: desktop
# Build private source; publish only installers, feeds and signatures to the public releases repository.
# Apple credentials remain in desktop-release. U3 secrets belong to the protected release environment.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (v<version>)
        required: true
        type: string
      mac_only:
        description: Emergency Mac release without a Windows feed
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
env:
  RELEASE_REPO: smpbrighton/u3-studio-releases
jobs:
  plan:
    if: github.repository == 'smpbrighton/openfilm-u3'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      mac_only: ${{ steps.plan.outputs.mac_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.U3_RELEASES_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          MAC_ONLY: ${{ inputs.mac_only || false }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${TAG#v}"
          [[ "$VERSION" == "$(node -p "require('./apps/desktop/package.json').version")" ]]
          COMMIT="$(git rev-parse HEAD)"
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$COMMIT" ]]
          test -n "$GH_TOKEN"
          if [[ "$MAC_ONLY" != true ]]; then
            node -e "if (!require('./packages/openfilm/product.official.json').desktop.minisignPublicKey.trim()) process.exit(1)"
          fi
          MARKER="Source commit: $COMMIT; mac_only: $MAC_ONLY"
          if gh release view "$TAG" --repo "$RELEASE_REPO" --json isDraft,body > release.json 2>/dev/null; then
            jq -e --arg marker "$MARKER" '.isDraft == true and (.body | contains($marker))' release.json > /dev/null
          else
            # A failed create (including an existing public tag) stops the run; it never edits a public release.
            printf 'u3 Studio %s.\n\n%s\n' "$VERSION" "$MARKER" > notes.md
            if [[ "$MAC_ONLY" == true ]]; then
              printf '\nEmergency Mac-only release. No Windows update is included.\n' >> notes.md
            fi
            gh release create "$TAG" --repo "$RELEASE_REPO" --draft --title "u3 Studio $VERSION" --notes-file notes.md
          fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "commit=$COMMIT"; echo "mac_only=$MAC_ONLY"; } >> "$GITHUB_OUTPUT"

  mac:
    needs: plan
    runs-on: macos-14
    timeout-minutes: 120
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Signing and notarization credentials, in a keychain of this run
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/openfilm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # the Developer ID Application certificate and its private key
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # this keychain first, and the default: codesign finds the identity, notarytool the profile
          # shellcheck disable=SC2046 # the keychains already listed, one word each
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"
          # notarytool's credentials (an App Store Connect API key) as the keychain profile release.mjs names
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials openfilm-notary --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and notarize the Mac arm64 target
        env:
          GH_TOKEN: ${{ github.token }}
          OPENFILM_SIGN_IDENTITY: ${{ secrets.OPENFILM_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENFILM_NOTARY_PROFILE: openfilm-notary
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$OPENFILM_SIGN_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          mkdir upload
          for arch in arm64; do
            (cd apps/desktop && npm run release -- --official --arch="$arch")
            out="apps/desktop/.release/$arch/out"
            cp "$out/latest-mac.yml" "upload/latest-$arch-mac.yml"
            for file in "$out"/*.dmg "$out"/*.zip "$out"/*.blockmap; do
              [[ ! -f "$file" ]] || cp "$file" upload/
            done
          done
          node apps/desktop/scripts/u3-release.mjs fragment mac "$VERSION" "$COMMIT" upload
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/openfilm-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: plan
    if: needs.plan.outputs.mac_only != 'true'
    # Preserve the existing NSIS cross-build on macOS; minisign needs no Windows certificate.
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install minisign
      - name: Verify legacy Ed acceptance and ED rejection with Electron
        working-directory: apps/desktop
        run: ELECTRON_RUN_AS_NODE=1 pnpm exec electron --test src/u3-minisign.test.mjs src/u3-update-verify.test.mjs
      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release -- --official --platform=win --arch=x64
      - name: Sign Windows installer with legacy Ed and bind its version
        env:
          U3_WINDOWS_MINISIGN_KEY: ${{ secrets.U3_WINDOWS_MINISIGN_KEY }}
          U3_WINDOWS_MINISIGN_PASSWORD: ${{ secrets.U3_WINDOWS_MINISIGN_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          test -n "$U3_WINDOWS_MINISIGN_KEY"
          test -n "$U3_WINDOWS_MINISIGN_PASSWORD"
          KEY_FILE="$RUNNER_TEMP/u3-windows-minisign.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$U3_WINDOWS_MINISIGN_KEY" > "$KEY_FILE"
          mkdir upload
          out=apps/desktop/.release/win-x64/out
          for file in "$out"/*.exe; do
            comment="$(printf 'version:%s\tfile:%s' "$VERSION" "${file##*/}")"
            printf '%s\n' "$U3_WINDOWS_MINISIGN_PASSWORD" | minisign -S -l -s "$KEY_FILE" -m "$file" -t "$comment" > /dev/null
            cp "$file" "$file.minisig" upload/
          done
          for file in "$out"/*.blockmap; do
            [[ ! -f "$file" ]] || cp "$file" upload/
          done
          cp "$out/latest.yml" upload/latest-win-x64.yml
          node apps/desktop/scripts/u3-release.mjs fragment windows "$VERSION" "$COMMIT" upload
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: upload/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, mac, windows]
    if: >-
      always() && needs.plan.result == 'success' && needs.mac.result == 'success' &&
      (needs.windows.result == 'success' || (needs.plan.outputs.mac_only == 'true' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Linux onnxruntime-node 1.22 postinstall fetches CUDA binaries and fails; publish never loads onnxruntime.
      - run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: upload
          merge-multiple: true
      - name: Validate fragments and publish the draft
        env:
          GH_TOKEN: ${{ secrets.U3_RELEASES_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          MAC_ONLY: ${{ needs.plan.outputs.mac_only }}
        run: |
          set -euo pipefail
          extra=()
          [[ "$MAC_ONLY" != true ]] || extra+=(--mac-only)
          node apps/desktop/scripts/u3-release.mjs check "$VERSION" "$COMMIT" upload "${extra[@]}"
          assert_draft() {
            gh release view "$TAG" --repo "$RELEASE_REPO" --json isDraft,body |
              jq -e --arg marker "Source commit: $COMMIT; mac_only: $MAC_ONLY" '.isDraft == true and (.body | contains($marker))' > /dev/null
          }
          assert_draft
          gh release upload "$TAG" upload/* --repo "$RELEASE_REPO" --clobber
          # Re-read the remote bytes, including old leftovers from a failed attempt, before making it latest.
          mkdir downloaded
          gh release download "$TAG" --repo "$RELEASE_REPO" --dir downloaded
          node apps/desktop/scripts/u3-release.mjs check "$VERSION" "$COMMIT" downloaded "${extra[@]}"
          cmp upload/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          assert_draft
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false --latest
